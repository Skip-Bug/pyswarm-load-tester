name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Добавляем права на запись в репозиторий (нужно для создания релиза)
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: pyswarm-windows.exe
            sep: ';'
          - os: ubuntu-latest
            artifact: pyswarm-linux
            sep: ':'
          - os: macos-latest
            artifact: pyswarm-macos
            sep: ':'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - run: pip install pyinstaller
      - run: pip install .
      
      - run: pyinstaller --onefile --name pyswarm --add-data "chart.min.js${{ matrix.sep }}." pyswarm.py
      
      # Этот шаг сохраняет артефакты для истории (опционально)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

      # 🚀 АВТОМАТИЧЕСКОЕ ПРИКРЕПЛЕНИЕ К РЕЛИЗУ
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
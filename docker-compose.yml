services:
  master:
    build: .
    container_name: pyswarm_master
    command: ["--master"]
    ports:
      - "8000:8000"
      - "8089:8089"
      - "5557:5557"
    volumes:
      - ./tmp:/app/tmp
    environment:
      - LOCUST_WORKERS=0

  worker:
    build: .
    command: ["--worker", "--master-host", "master"]
    depends_on: [master]
    volumes:
      - ./tmp:/app/tmp
    deploy:
      replicas: 2